name: renewable-pulse

networks:
  renewable-pulse:
    driver: bridge

volumes:
  renewable-pulse-redpanda:
  renewable-pulse-timescale:

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: renewable-pulse-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - renewable-pulse-redpanda:/var/lib/redpanda/data
    networks:
      - renewable-pulse
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    container_name: renewable-pulse-redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    networks:
      - renewable-pulse
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: renewable-pulse-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: renewable_pulse
      POSTGRES_PASSWORD: renewable_pulse
      POSTGRES_DB: renewable_pulse
    ports:
      - "5434:5432"
    volumes:
      - renewable-pulse-timescale:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renewable_pulse -d renewable_pulse"]
      interval: 2s
      timeout: 3s
      retries: 20
